name: Release

on:
  push:
    tags:
      - "release/[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Check tag matches module.json
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="$(jq -r '.version' module.json)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag release/${TAG} does not match module.json version ${VERSION}"
            exit 1
          fi
      - name: Package module
        run: |
          zip -r sfrpg-modern-ui.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "test/*" \
            -x "node_modules/*" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "sfrpg-modern-ui.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sfrpg-modern-ui.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for ${GITHUB_REF_NAME#release/}."
